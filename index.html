<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure AWS CloudFront + S3 Architecture</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; border: 1px solid #334155; max-width: 520px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h1 { color: #38bdf8; margin-top: 0; font-size: 1.6rem; }
    p { color: #cbd5e1; line-height: 1.6; }
    .badge { display: inline-block; background: #065f46; color: #6ee7b7; padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HTTPS Verified &bull; S3 Origin Locked</div>
    <h1>Secure Cloud Content Delivery</h1>
    <p>This site is hosted in a <strong>private Amazon S3 bucket</strong> and delivered globally over HTTPS via <strong>Amazon CloudFront</strong> using Origin Access Control (OAC).</p>
  </div>
</body>
</html>
